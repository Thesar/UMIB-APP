<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Reset your Screamulus password</title></head>
  <body style="font-family:Arial,sans-serif;line-height:1.6;color:#172033;padding:24px">
    <h1>Screamulus</h1>
    <h2>Reset your password</h2>
    <p>Enter this code in Screamulus to verify your request and choose a new password.</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>If you did not request a password reset, you can ignore this email. Do not share this code.</p>
  </body>
</html>
